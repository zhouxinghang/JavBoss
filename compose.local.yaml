name: javboss-local

services:
  javboss:
    image: ${JAVBOSS_DOCKER_IMAGE:-javboss:local}
    user: "${JAVBOSS_DOCKER_UID:-1000}:${JAVBOSS_DOCKER_GID:-1000}"
    build:
      context: .
      args:
        BUILD_MODE: development
        DOCKER_HUB_REGISTRY: ${JAVBOSS_DOCKER_HUB_MIRROR:-m.daocloud.io/docker.io}
        GCR_REGISTRY: ${JAVBOSS_DOCKER_GCR_MIRROR:-m.daocloud.io/gcr.io}
        BUILDKIT_SYNTAX: ${JAVBOSS_DOCKERFILE_FRONTEND:-m.daocloud.io/docker.io/docker/dockerfile:1.7}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
    network_mode: host
    command: ["./javboss", "-port", "${JAVBOSS_DOCKER_PORT:-5174}"]
    environment:
      JAVBOSS_PROXY_HOST_GATEWAY: "0"
    volumes:
      - type: bind
        source: ${JAVBOSS_DOCKER_DATA_DIR:-./docker-data}
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: /
        target: /host
    restart: unless-stopped
